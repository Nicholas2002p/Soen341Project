name: CI

on:
  pull_request:
     types: [opened, synchronize, reopened]
  workflow_dispatch:
  push:
    branches:
      [main, dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: careerconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d careerconnect_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/careerconnect_test
      NODE_ENV: test
      GOOGLE_CLIENT_ID: ci-placeholder
      TLS_KEY_PATH: certs/localhost-key.pem
      TLS_CERT_PATH: certs/localhost.pem

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate temporary HTTPS certificates
        run: |
          mkdir -p apps/server/certs
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout apps/server/certs/localhost-key.pem \
            -out apps/server/certs/localhost.pem \
            -days 1 \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=apps/server

      - name: Apply database migrations
        run: npm exec --workspace=apps/server -- prisma migrate deploy

      - name: Run lint
        run: npm run lint

      - name: Build applications
        run: npm run build

      - name: Run all server tests
        run: npm test --workspace=apps/server
